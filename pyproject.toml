[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cairnspan"
version = "0.1.0"
description = "Bounded, receipt-producing delegation between local OAuth-backed coding agents such as Claude Code and Codex."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rahul Krishna" }]
keywords = [
    "agents",
    "multi-agent",
    "delegation",
    "claude-code",
    "codex",
    "cli",
    "receipts",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
cairnspan = "cairnspan.cli:main"

[tool.setuptools]
packages = ["cairnspan", "cairnspan.scripts"]

[tool.setuptools.package-dir]
cairnspan = "src/cairnspan"
"cairnspan.scripts" = "skills/cairnspan/scripts"
