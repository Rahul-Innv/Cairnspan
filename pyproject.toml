[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cairnspan"
version = "0.1.1"
description = "Bounded, receipt-producing task handoffs between independently authenticated local agent harnesses."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rahul Krishna" }]
keywords = [
    "agents",
    "agent-harnesses",
    "multi-agent",
    "delegation",
    "local-first",
    "cli",
    "receipts",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Repository = "https://gitlab.com/krahul02004/Cairnspan"
Issues = "https://gitlab.com/krahul02004/Cairnspan/-/work_items"
Changelog = "https://gitlab.com/krahul02004/Cairnspan/-/blob/main/CHANGELOG.md"

[project.scripts]
cairnspan = "cairnspan.cli:main"

[tool.setuptools]
packages = ["cairnspan", "cairnspan.scripts"]

[tool.setuptools.package-dir]
cairnspan = "src/cairnspan"
"cairnspan.scripts" = "skills/cairnspan/scripts"
